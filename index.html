    <style>
      /* Cyber-themed preloader shown while React is loading */
      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background-color: #0a0a0f;
        font-family: 'Space Grotesk', monospace;
      }
      .cyber-loader {
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .cyber-spinner {
        width: 60px;
        height: 60px;
        border: 4px solid rgba(16, 185, 129, 0.1);
        border-top-color: #10b981;
        border-left-color: #06b6d4;
        border-radius: 50%;
        animation: cyber-spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
        margin-bottom: 20px;
        box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
      }
      .cyber-text {
        color: #10b981;
        font-size: 14px;
        letter-spacing: 4px;
        text-transform: uppercase;
        animation: cyber-pulse 1.5s ease-in-out infinite;
      }
      @keyframes cyber-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes cyber-pulse {
        0%, 100% { opacity: 1; text-shadow: 0 0 10px rgba(16, 185, 129, 0.5); }
        50% { opacity: 0.4; text-shadow: none; }
      }
    </style>
  </head>
  <body class="bg-[#0a0a0f] text-stone-100 antialiased selection:bg-emerald-500 selection:text-stone-950">
    <div id="root">
      <div class="cyber-loader">
        <div class="cyber-spinner"></div>
        <div class="cyber-text">System Initializing...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
